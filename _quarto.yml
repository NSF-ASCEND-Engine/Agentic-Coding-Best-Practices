project:
  type: book
  output-dir: _book

book:
  title: "Agentic Coding Best Practices"
  subtitle: "Working with Claude Code, Codex, and other coding agents"
  author: "Josh Day"
  date: last-modified
  search: true
  repo-url: https://github.com/joshday/Agentic-Coding-Best-Practices
  repo-actions: [edit, issue]
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - chapters/01-tools.qmd
    - chapters/02-context.qmd
    - chapters/03-workflows.qmd
    - chapters/04-extending.qmd
    - chapters/05-failure-modes.qmd
    - chapters/06-reference.qmd

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    callout-appearance: simple
    link-external-newwindow: true
